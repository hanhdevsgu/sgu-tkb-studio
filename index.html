<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thời Khóa Biểu SGU - Xem Lịch Học Đại Học Sài Gòn Nhanh &amp; Tiện Lợi</title>
    <meta name="description" content="Thời khóa biểu SGU - Công cụ hỗ trợ sinh viên Đại học Sài Gòn xem và sắp xếp thời khóa biểu nhanh chóng, tiện lợi, tránh xung đột lịch học." />
    <meta property="og:title" content="Thời Khóa Biểu SGU - Xem Lịch Học Đại Học Sài Gòn Nhanh &amp; Tiện Lợi" />
    <meta property="og:description" content="Thời khóa biểu SGU - Công cụ hỗ trợ sinh viên Đại học Sài Gòn xem và sắp xếp thời khóa biểu nhanh chóng, tiện lợi, tránh xung đột lịch học." />
    <style>
      html.dark {
        color-scheme: dark;
      }
      html:not(.dark) {
        color-scheme: light;
      }
      #sgu-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        z-index: 99999;
        gap: 16px;
      }
      .sgu-spin-ring {
        width: 42px;
        height: 42px;
        border: 3.5px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: sgu-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sgu-brand-text {
        font-size: 14px;
        font-weight: 700;
        color: #38bdf8;
        letter-spacing: 0.5px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .sgu-sub-text {
        font-size: 12px;
        font-weight: 500;
        color: #64748b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @keyframes sgu-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-background text-foreground font-sans antialiased min-h-screen">
    <div id="root">
      <div id="sgu-initial-loader">
        <div class="sgu-spin-ring"></div>
        <div style="text-align: center;">
          <div class="sgu-brand-text">SGU TKB STUDIO</div>
          <div class="sgu-sub-text" style="margin-top: 4px;">Đang khởi động hệ thống...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
